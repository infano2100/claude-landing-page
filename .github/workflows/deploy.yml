# CD Pipeline: deploy through environments
# dev  → auto on push to develop
# sit  → manual trigger (after dev)
# uat  → manual trigger with approval (after sit)
# prd  → manual trigger with approval (after uat)
name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prd

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ─── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ─── Deploy DEV ─────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → DEV
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    if: github.event_name == 'push' || github.event.inputs.environment == 'dev'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages (dev branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-dev
          commit_message: 'deploy: DEV from ${{ github.sha }}'

  # ─── Deploy SIT ─────────────────────────────────────────────────────────
  deploy-sit:
    name: Deploy → SIT
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: sit
    if: github.event.inputs.environment == 'sit'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages (sit branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-sit
          commit_message: 'deploy: SIT from ${{ github.sha }}'

  # ─── Deploy UAT ─────────────────────────────────────────────────────────
  deploy-uat:
    name: Deploy → UAT
    runs-on: ubuntu-latest
    needs: deploy-sit
    environment: uat
    if: github.event.inputs.environment == 'uat'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages (uat branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-uat
          commit_message: 'deploy: UAT from ${{ github.sha }}'

  # ─── Deploy PRD ─────────────────────────────────────────────────────────
  deploy-prd:
    name: Deploy → PRD
    runs-on: ubuntu-latest
    needs: deploy-uat
    environment: prd
    if: github.event.inputs.environment == 'prd'
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages (production)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'deploy: PRD from ${{ github.sha }}'
